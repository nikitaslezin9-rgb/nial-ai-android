const S1="<!doctype html>\n<html lang=\"ru\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Nial: знакомство (демо v3)<\/title>\n<style>\n*{box-sizing:border-box;margin:0}\n:root{--bg:#06040f;--fg:#fff;--sub:#ffffffcc;--glass:rgba(255,255,255,.08);--gb:rgba(255,255,255,.18);--inbg:#ffffff12;--inb:#ffffff30;--page:#05030c;--shadow:0 0 0 1px #ffffff18,0 30px 80px #000}\n:root[data-theme=light]{--bg:#efe9ff;--fg:#1d1238;--sub:#1d1238b3;--glass:rgba(255,255,255,.55);--gb:rgba(255,255,255,.9);--inbg:#ffffffaa;--inb:#8b5cf655;--page:#d9d0f5;--shadow:0 0 0 1px #8b5cf622,0 30px 80px #6d4fc255}\nbody{background:var(--page);display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:system-ui,Segoe UI,Roboto,sans-serif;color:var(--fg);transition:background .5s}\n#phone{position:relative;width:100vw;height:100vh;overflow:hidden;background:var(--bg);border-radius:0;box-shadow:var(--shadow);transition:background .5s}\ncanvas{position:absolute;inset:0;width:100%;height:100%}\n.orb{position:absolute;width:150px;height:150px;border-radius:50%;left:50%;top:36%;--hx:35%;\n background:radial-gradient(circle at var(--hx) 28%,#ffffffd0,var(--c) 38%,#0a0414 140%);\n box-shadow:0 0 70px var(--c),inset 0 0 30px #ffffff22;\n transform:translate(-50%,-50%) scale(var(--s,1));transition:top 1.4s cubic-bezier(.3,.8,.2,1),left 1.4s cubic-bezier(.3,.8,.2,1),transform 1.4s cubic-bezier(.3,.8,.2,1),opacity 1s;animation:float 4s ease-in-out infinite}\n:root[data-theme=light] .orb{box-shadow:0 14px 50px var(--c),inset 0 0 30px #ffffff44}\n@keyframes float{50%{margin-top:-10px}}\n.eye{position:absolute;top:58px;left:50%;margin-left:-6.5px;width:13px;height:24px;border-radius:8px;background:#fff;box-shadow:0 0 12px #fff;transition:height .3s,width .3s,top .3s,margin-left .3s,border-radius .3s}\n.mouth{position:absolute;left:50%;top:98px;width:34px;height:14px;margin-left:-17px;border-bottom:4px solid #fff;border-radius:0 0 34px 34px;transition:width .35s,height .35s,margin-left .35s,border-radius .35s;filter:drop-shadow(0 0 6px #fff)}\n.mouth.o{width:16px;height:16px;margin-left:-8px;border:4px solid #fff;border-radius:50%}\n.mouth.big{width:44px;height:20px;margin-left:-22px}\n.orb.happy .eye{height:12px;width:22px;margin-left:-11px;top:62px;background:transparent;border-top:5px solid #fff;border-radius:22px 22px 0 0;box-shadow:none}\n.puff{position:absolute;z-index:8;border-radius:50%;pointer-events:none;background:radial-gradient(circle,#ffffffcc,#ffffff00 70%)}\n:root[data-theme=light] .puff{background:radial-gradient(circle,#8b5cf6aa,#8b5cf600 70%)}\n.fuh{position:absolute;z-index:8;pointer-events:none;font-size:20px;font-style:italic;letter-spacing:.08em;color:var(--fg);opacity:0}\n.name{position:absolute;bottom:-36px;left:0;right:0;text-align:center;font-size:15px;letter-spacing:.14em;opacity:.9;transition:opacity .5s}\n.orb.noname .name{opacity:0}\n#nial{--c:#8b5cf6;z-index:3}\n#neo{--c:#22d3ee;z-index:2;opacity:0;--s:.2}\n#nio{--c:#f472b6;z-index:2;opacity:0;--s:.2}\n#nial.fly{top:24%;--s:.55}\n#neo.show{opacity:1;left:20%;top:30%;--s:.7}\n#nio.show{opacity:1;left:80%;top:30%;--s:.7}\n#nial.final{top:42%;--s:.95}\n.glass{background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--gb);border-radius:22px}\n.panel{position:absolute;left:22px;right:22px;z-index:5;padding:20px;opacity:0;pointer-events:none;transform:translateY(16px);transition:all .6s}\n.panel.on{opacity:1;pointer-events:auto;transform:none}\n#intro{bottom:70px;text-align:center}\n#intro h1{font-size:28px;margin-bottom:8px}\n#intro p{color:var(--sub);margin-bottom:18px;line-height:1.4}\n#ask{bottom:60px}\n#ask .q{font-size:19px;line-height:1.35;margin-bottom:14px}\n#ask input{width:100%;padding:13px 15px;border-radius:16px;border:1px solid var(--inb);background:var(--inbg);color:var(--fg);font-size:16px;outline:none;margin-bottom:12px}\n#ask input:focus{bor ass\" id=\"welcome\"><h2>Добро пожаловать в семью<\/h2><p id=\"wsub\"><\/p><button id=\"again\">Войти<\/button><\/div>\n<\/div>\n<script>\nconst $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms));\nconst root=document.documentElement,mq=matchMedia('(prefers-color-scheme: dark)');\nlet mode='auto';\nfunction applyTheme(){const dark=mode==='auto'?mq.matches:mode==='dark';root.dataset.theme=dark?'dark':'light';}\nmq.onchange=applyTheme;applyTheme();\nconst cv=$('#c'),cx=cv.getContext('2d');let W,H;\nfunction rs(){const r=cv.getBoundingClientRect();W=cv.width=r.width*devicePixelRatio;H=cv.height=r.height*devicePixelRatio}\nrs();addEventListener('resize',rs);\nconst stars=Array.from({length:380},()=>({x:Math.random()*2-1,y:Math.random()*2-1,z:Math.random()*.98+.02,h:Math.random()}));\nlet speed=.0015,target=.0015;\nfunction loop(){\n const dark=root.dataset.theme==='dark';\n speed+=(target-speed)*.04;\n const a=speed>.02?.35:.9;\n cx.fillStyle=dark?`rgba(6,4,15,${a})`:`rgba(239,233,255,${a})`;cx.fillRect(0,0,W,H);\n const mx=W/2,my=H*.34;\n for(const s of stars){\n  const pz=s.z+speed*(speed>.01?9:0);\n  const x1=mx+s.x/pz*W*.5,y1=my+s.y/pz*H*.5;\n  s.z-=speed;\n  if(s.z<=.02){s.z=1;s.x=Math.random()*2-1;s.y=Math.random()*2-1}\n  const x2=mx+s.x/s.z*W*.5,y2=my+s.y/s.z*H*.5,b=1-s.z;\n  cx.strokeStyle=dark?`hsla(${230+s.h*80},90%,${70+b*25}%,${.25+b*.75})`:`hsla(${250+s.h*60},70%,${55-b*20}%,${.2+b*.6})`;\n  cx.lineWidth=(.6+b*1.8)*devicePixelRatio;\n  cx.beginPath();cx.moveTo(x1,y1);cx.lineTo(x2+.01,y2);cx.stroke();\n }\n requestAnimationFrame(loop)}\nloop();\nfunction setAng(el,a){\n const r=a*Math.PI/180;\n el.querySelectorAll('.eye').forEach((e,i)=>{\n  const phi=(a+(i?20:-20))*Math.PI/180,x=Math.sin(phi)*74,v=Math.cos(phi);\n  e.style.transform=`translateX(${x}px) scaleX(${Math.max(v,0.001)})`;\n  e.style.opacity=v>0.04?1:0;\n });\n const m=el.querySelector('.mouth');\n if(m){const v=Math.cos(r);m.style.transform=`translateX(${Math.sin(r)*74}px) scaleX(${Math.max(v,0.001)})`;m.style.opacity=v>0.04?1:0}\n el.style.setProperty('--hx',(35-Math.sin(r)*20)+'%');\n}\nfunction turn(el,from,to,ms){\n return new Promise(res=>{\n  const t0=performance.now();\n  (function f(now){\n   let t=Math.min((now-t0)/ms,1);\n   const e=t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;\n   setAng(el,from+(to-from)*e);\n   el.style.scale=(1-.12*Math.sin(Math.PI*t))+' '+(1+.05*Math.sin(Math.PI*t));\n   el.style.rotate=(-6*Math.sin(Math.PI*t))+'deg';\n   if(t<1)requestAnimationFrame(f);else{el.style.scale='';el.style.rotate='';res()}\n  })(t0);\n })}\n['#nial','#neo','#nio'].forEach(s=>setAng($(s),0));\nfunction puff(el){\n const ph=$('#phone').getBoundingClientRect(),r=el.querySelector('.mouth').getBoundingClientRect();\n const x=r.left+r.width/2-ph.left,y=r.top+r.height/2-ph.top;\n for(let i=0;i<9;i++){\n  const d=document.createElement('div');d.className='puff';const s=16+Math.random()*26;\n  d.style.cssText=`width:${s}px;height:${s}px;left:${x-s/2}px;top:${y-s/2}px`;$('#phone').appendChild(d);\n  const dx=(Math.random()-.5)*130,dy=40+Math.random()*90;\n  d.animate([{transform:'translate(0,0) scale(.3)',opacity:.9},{transform:`translate(${dx}px,${dy}px) scale(1.6)`,opacity:0}],{duration:900+Math.random()*500,easing:'ease-out',delay:i*35,fill:'backwards'}).onfinish=()=>d.remove();\n }\n const t=document.createElement('div');t.className='fuh';t.textContent='фух…';t.style.left=(x-22)+'px';t.style.top=(y+22)+'px';$('#phone').appendChild(t);\n t.animate([{opacity:0,transform:'translateY(0)'},{opacity:1,transform:'translateY(12px)',offset:.25},{opacity:0,transform:'translateY(46px)'}],{duration:1300,easing:'ease-out'}).onfinish=()=>t.remove();\n}\nasync function breath(el){\n const m=el.querySelector('.mouth');\n el.classList.add('happy');m.classList.add('big');\n const a=el.animate([{scale:'1'},{scale:'1.16'}],{duration:950,easing:'ease-out',fill:'forwards'});\n await sleep(1200);\n m.classList.remove('big');m.classList.add('o');el.classList.remove('happy');\n a.cancel();\n el.animate([{scale:'1.16'},{scale:'.88',offset:.45},{scale:'1'}],{duration:900,easing:'ease-in-out'});\n puff(el);target=.02;\n await sleep(700);\n m.classList.remove('o');\n await sleep(250);\n}\nconst nial=$('#nial'),dots=[...document.querySelectorAll('.dots i')];\nfunction ask(q,{skip=false,ph='',type='text'}={}){\n return new Promise(res=>{\n  $('#q').textContent=q;const i=$('#inp');i.value='';i.placeholder=ph;i.type=type;\n  $('#skip').style.display=skip?'':'none';\n  $('#ask').classList.add('on');setTimeout(()=>i.focus(),500);\n  const done=v=>{$('#ask').classList.remove('on');$('#next').onclick=$('#skip').onclick=i.onkeydown=null;res(v)};\n  $('#next').onclick=()=>{if(i.value.trim())done(i.value.trim());else i.focus()};\n  $('#skip').onclick=()=>done('');\n  i.onkeydown=e=>{if(e.key==='Enter')$('#next').click()};\n })}\nasync function run(){\n $('#go').onclick=null;\n $('#intro').classList.remove('on');\n await sleep(250);\n await breath(nial);\n nial.classList.add('noname');\n await turn(nial,0,180,1300);\n await sleep(150);\n nial.classList.add('fly');target=.03;$('#dots').classList.add('on');await sleep(1800);\n dots[0].classList.add('a');target=.012;\n const name=await ask('Как тебя зовут?',{ph:'Твоё имя'});\n target=.035;await sleep(1500);dots[0].classList.remove('a');dots[1].classList.add('a');target=.012;\n const age=await ask('Приятно познакомиться, '+name+'! Сколько тебе лет?',{skip:true,ph:'Возраст',type:'number'});\n target=.035;await sleep(1500);dots[1].classList.remove('a');dots[2].classList.add('a');target=.012;\n const addr=await ask('И как к тебе лучше обращаться?',{ph:name});\nparent.postMessage({profile:{name:name,age:age,addr:addr||name}},'*');\n target=.05;await sleep(1400);\n $('#dots').classList.remove('on');\n target=.0015;await sleep(900);\n nial.classList.remove('fly');nial.classList.add('final');\n await turn(nial,180,360,1400);setAng(nial,0);\n nial.classList.remove('noname');\n nial.classList.add('happy');nial.querySelector('.mouth').classList.add('big');\n await sleep(500);$('#neo').classList.add('show');$('#nio').classList.add('show');\n await sleep(1500);\n $('#wsub').textContent=(addr||name)+', тебя ждут Nial, Neo и Nio.';\n $('#welcome').classList.add('on');\n $('#again').onclick=()=>{parent.postMessage({go:1,name:(addr||name)},'*')};\n}\n$('#go').onclick=run;\naddEventListener('message',e=>{const d=e.data||{};if(d.theme){mode=d.theme;applyTheme()}});<\/script><\/body><\/html>",S2="<!doctype html>\n<html lang=\"ru\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Nial: семья на поляне (демо)<\/title>\n<style>\n*{box-sizing:border-box;margin:0}\n:root{--fg:#fff;--sub:#ffffffd0;--glass:rgba(10,8,30,.38);--gb:rgba(255,255,255,.22);--page:#05030c;--shadow:0 0 0 1px #ffffff18,0 30px 80px #000;--acc:#8b5cf6}\n:root[data-theme=light]{--fg:#1d1238;--sub:#1d1238c0;--glass:rgba(255,255,255,.55);--gb:rgba(255,255,255,.95);--page:#d9d0f5;--shadow:0 0 0 1px #8b5cf622,0 30px 80px #6d4fc255}\nbody{background:var(--page);display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:system-ui,Segoe UI,Roboto,sans-serif;color:var(--fg);transition:background .5s}\n#phone{position:relative;width:100vw;height:100vh;overflow:hidden;border-radius:0;box-shadow:var(--shadow);user-select:none;background:#000}\ncanvas{position:absolute;inset:0;width:100%;height:100%}\n.orb{position:absolute;left:0;top:0;width:150px;height:150px;border-radius:50%;\n background:radial-gradient(circle at 35% 28%,#ffffffd8,var(--c) 38%,#12061f 145%);\n box-shadow:0 0 60px color-mix(in srgb,var(--c) 70%,transparent),inset 0 0 30px #ffffff22;will-change:transform}\n.face{position:absolute;inset:0}\n.eye{position:absolute;top:58px;width:13px;height:24px;border-radius:8px;background:#fff;box-shadow:0 0 10px #fff;transition:height .25s,top .25s,width .25s,transform .09s}\n.eye.l{left:46px}.eye.r{right:46px}\n.blink .eye{transform:scaleY(.08)}\n.brow{position:absolute;top:44px;width:20px;height:4px;border-radius:3px;background:#ffffffd0;transition:transform .25s}\n.brow.l{left:42px}.brow.r{right:42px}\n.orb[data-e=focus] .eye{height:15px;top:62px;width:15px}\n.orb[data-e=focus] .brow.l{transform:translateY(4px) rotate(10deg)}\n.orb[data-e=focus] .brow.r{transform:translateY(4px) rotate(-10deg)}\n.orb[data-e=up] .brow{transform:translateY(-8px)}\n.orb[data-e=joy] .eye{height:12px;width:22px;top:62px;margin-left:-4px;background:transparent;border-top:5px solid #fff;border-radius:22px 22px 0 0;box-shadow:none}\n.orb[data-e=joy] .brow{transform:translateY(-7px)}\n.orb.lift .brow{transform:translateY(-8px)!important}\n.mouth{position:absolute;left:50%;top:96px;border:3px solid #fff;border-top-width:0;border-radius:0 0 50% 50%/0 0 100% 100%;transform:translateX(-50%);box-shadow:0 0 6px #fff8}\n.shadow{position:absolute;left:0;top:0;width:110px;height:18px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.35),rgba(0,0,0,0) 70%);pointer-events:none}\n.glass{background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--gb);border-radius:22px;color:var(--fg)}\n#sub{position:absolute;left:18px;right:18px;bottom:36px;padding:14px 18px;z-index:5;transition:opacity .5s;min-height:120px}\n#sn{font-weight:700;letter-spacing:.1em;font-size:14px;margin-bottom:6px}#sn small{font-weight:400;letter-spacing:0;opacity:.75;margin-left:8px}\n#st{font-size:17px;line-height:1.45}\n#bars{position:absolute;top:14px;left:16px;right:16px;display:flex;gap:6px;z-index:9}\n.seg{flex:1;height:4px;border-radius:2px;background:#ffffff40;overflow:hidden}\n.seg i{display:block;height:100%;width:0;background:#fff}\n.ctl{position:absolute;top:28px;z-index:9;font-size:13px;padding:6px 12px;border-radius:14px;cursor:pointer;color:var(--fg);border:1px solid var(--gb);background:var(--glass);backdrop-filter:blur(10px)}\n#skip{right:14px}#snd{left:14px}#tg{right:96px}\n.c
